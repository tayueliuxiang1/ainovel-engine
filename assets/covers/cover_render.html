<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 896px;
    height: 1200px;
    overflow: hidden;
    background-color: #000;
    font-family: "Microsoft YaHei", "SimHei", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .cover-container {
    position: relative;
    width: 896px;
    height: 1200px;
    background: url("cover_datang_trendy.jpg") no-repeat center center;
    background-size: cover;
    box-sizing: border-box;
  }
  /* 顶部与底部柔和遮罩，确保文字在缩略图上绝对清晰 */
  .vignette-top {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 380px;
    background: linear-gradient(180deg, rgba(5,7,15,0.85) 0%, rgba(5,7,15,0.65) 45%, rgba(5,7,15,0) 100%);
    pointer-events: none;
  }
  .vignette-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 280px;
    background: linear-gradient(0deg, rgba(5,7,15,0.92) 0%, rgba(5,7,15,0.7) 50%, rgba(5,7,15,0) 100%);
    pointer-events: none;
  }
  
  /* 顶部标签栏 */
  .header-badge-row {
    position: absolute;
    top: 42px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    z-index: 10;
  }
  .badge-tag {
    background: rgba(18, 22, 38, 0.85);
    border: 1px solid rgba(255, 215, 0, 0.6);
    color: #FFD700;
    font-size: 19px;
    font-weight: bold;
    padding: 6px 20px;
    border-radius: 4px;
    letter-spacing: 2px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), inset 0 0 10px rgba(255, 215, 0, 0.2);
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  .badge-red {
    background: linear-gradient(135deg, #A81C1C 0%, #680E0E 100%);
    border: 1px solid rgba(255, 180, 180, 0.5);
    color: #FFF0F0;
    box-shadow: 0 4px 15px rgba(168, 28, 28, 0.5);
  }

  /* 核心书名区域 */
  .title-area {
    position: absolute;
    top: 100px;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 10;
  }
  .sub-slogan {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 5px;
    color: #E2E8F0;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9), 0 0 12px rgba(255,215,0,0.4);
    margin-bottom: 8px;
  }
  .main-title {
    font-size: 88px;
    font-weight: 900;
    letter-spacing: 8px;
    line-height: 1.1;
    margin: 0;
    padding: 0;
    background: linear-gradient(180deg, #FFFFFF 0%, #FFF3B0 25%, #FFD700 55%, #D4AF37 80%, #996515 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    -webkit-text-stroke: 3px #180D02;
    filter: drop-shadow(0 8px 18px rgba(0,0,0,0.95)) drop-shadow(0 0 35px rgba(255,215,0,0.6));
  }
  .title-divider {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin-top: 12px;
  }
  .line-ornament {
    width: 120px;
    height: 2px;
    background: linear-gradient(90deg, rgba(255,215,0,0) 0%, rgba(255,215,0,0.85) 50%, rgba(255,215,0,0) 100%);
  }
  .tagline-text {
    font-size: 21px;
    font-weight: bold;
    letter-spacing: 4px;
    color: #FFE699;
    text-shadow: 0 2px 6px rgba(0,0,0,0.9);
  }

  /* 底部作者与内容元素标签 */
  .bottom-info-area {
    position: absolute;
    bottom: 45px;
    left: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 10;
  }
  .feature-tags-row {
    display: flex;
    gap: 16px;
    margin-bottom: 22px;
  }
  .feature-pill {
    background: rgba(10, 15, 30, 0.75);
    border: 1px solid rgba(100, 200, 255, 0.4);
    color: #A5F3FC;
    font-size: 17px;
    font-weight: 600;
    padding: 5px 16px;
    border-radius: 20px;
    letter-spacing: 2px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    box-shadow: 0 3px 10px rgba(0,0,0,0.5);
  }
  .author-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }
  .author-name {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 6px;
    color: #FFFFFF;
    text-shadow: 0 3px 10px rgba(0,0,0,0.95), 0 0 15px rgba(255,255,255,0.4);
  }
  .author-suffix {
    font-size: 26px;
    font-weight: 600;
    color: #CBD5E1;
    margin-left: -8px;
    letter-spacing: 2px;
  }
  .author-seal {
    width: 44px;
    height: 44px;
    background: #991B1B;
    border: 2px solid #DC2626;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.7), inset 0 0 6px rgba(0,0,0,0.4);
  }
  .seal-text {
    font-family: "STKaiti", "SimSun", serif;
    font-size: 13px;
    line-height: 15px;
    font-weight: bold;
    color: #FEF2F2;
    letter-spacing: 1px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
<div class="cover-container">
  <div class="vignette-top"></div>
  <div class="vignette-bottom"></div>

  <!-- 顶部认证标 -->
  <div class="header-badge-row">
    <div class="badge-tag badge-red">番茄官方签约</div>
    <div class="badge-tag">无系统 · 硬核大唐工业</div>
  </div>

  <!-- 核心书名区域 -->
  <div class="title-area">
    <div class="sub-slogan">一柄规尺度乾坤 · 万吨渭水逆天流</div>
    <h1 class="main-title">大唐第一工科生</h1>
    <div class="title-divider">
      <div class="line-ornament"></div>
      <div class="tagline-text">手搓盛唐第一工业帝国</div>
      <div class="line-ornament"></div>
    </div>
  </div>

  <!-- 底部作者与风格特色元素 -->
  <div class="bottom-info-area">
    <div class="feature-tags-row">
      <div class="feature-pill">机械水利</div>
      <div class="feature-pill">物理降维</div>
      <div class="feature-pill">君臣相知</div>
      <div class="feature-pill">盛唐风骨</div>
    </div>
    <div class="author-row">
      <span class="author-name">踏月难留香</span>
      <span class="author-suffix">著</span>
      <div class="author-seal">
        <span class="seal-text">踏留</span>
        <span class="seal-text">月香</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
